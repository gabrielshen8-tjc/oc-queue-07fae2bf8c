*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-underline-offset:2px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--pane);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.stamp{color:var(--mute);font-size:12px;margin-left:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--pane);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
input{flex:1;min-width:180px;max-width:340px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 11px;color:var(--mute)}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg b{font-weight:650;margin-left:4px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,420px) 1fr}
#list{overflow:auto;background:var(--pane);border-right:1px solid var(--line);margin:0;padding:0;list-style:none}
#list li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
#list li[aria-selected=true]{background:var(--sel)}
.tier{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:650;font-size:13px;color:#fff}
.tier[data-t="4"],.tier[data-t="5"]{color:var(--ink)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:12px}
.sc{font-weight:650;text-align:right}.sc small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.ok{color:var(--ok)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.empty{padding:40px 20px;color:var(--mute);text-align:center}
#sheet{overflow:auto;padding:22px 32px 48px}
#sheet .in{max-width:760px}
.top{display:flex;gap:12px;align-items:flex-start}
h2{margin:0;font-size:22px;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.acts a{border:1px solid var(--line);border-radius:7px;padding:5px 11px;text-decoration:none;background:var(--pane)}
.acts a.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.flag{display:inline-block;background:var(--flagbg);color:var(--flag);border-radius:5px;padding:1px 8px;font-size:12px;margin:6px 6px 0 0}
section{margin-top:24px}
h3{margin:0 0 6px;font-size:13px;font-weight:650;color:var(--mute)}
.open{font-size:16px;line-height:1.45;margin:0;max-width:62ch}
ol,ul.q{margin:0;padding-left:20px;max-width:68ch}li+li{margin-top:8px}
.ask{background:var(--sel);border-radius:8px;padding:10px 14px;max-width:68ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 28px}
.facts p{margin:0}
.bars{display:grid;gap:5px;max-width:360px;margin:6px 0 8px}
.bar{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:12px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i s{display:block;height:100%;background:currentColor}
.back{display:none}.src{display:block;color:var(--mute);font-size:12px;margin:2px 0 6px}
.seg{max-width:100%;overflow-x:auto}.seg button{white-space:nowrap}.tools select{flex:1 1 130px;min-width:0}
details{margin-top:24px}summary{cursor:pointer;color:var(--mute);font-weight:650;font-size:13px}
details p{max-width:68ch}
@media(max-width:820px){
 main{grid-template-columns:1fr}#sheet{display:none;position:fixed;inset:0;background:var(--bg);z-index:5;padding:14px 16px 40px}

}
@media(prefers-reduced-motion:no-preference){#sheet .in{animation:in .22s cubic-bezier(.16,1,.3,1)}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const num=v=>v==null?'—':v.toLocaleString(),cls=a=>a>=80?'ok':a>=55?'mid':'bad';
let tier=0,sel=null,L=[];
[...new Set(D.map(d=>d.niche).filter(Boolean))].sort().forEach(n=>$('#niche').insertAdjacentHTML('beforeend',`<option>${esc(n)}</option>`));
function tiers(){const c={};D.forEach(d=>c[d.tier]=(c[d.tier]||0)+1);
 $('#tiers').innerHTML=[[0,'All',D.length],...[1,2,3,4,5].map(t=>[t,'Tier '+t,c[t]||0])].map(([t,n,k])=>`<button aria-pressed="${tier==t}" data-t="${t}">${n}<b>${k}</b></button>`).join('');
 document.querySelectorAll('#tiers button').forEach(b=>b.onclick=()=>{tier=+b.dataset.t;sel=null;render()})}
function render(){tiers();const q=$('#q').value.toLowerCase(),n=$('#niche').value,f=$('#flag').value,s=$('#sort').value;
 L=D.filter(d=>(!tier||d.tier==tier)&&(!n||d.niche==n)&&(!q||[d.name,d.city,d.owner,d.does,d.niche].join(' ').toLowerCase().includes(q))
  &&(f==''||(f=='clean'&&!d.flags.length)||(f=='flagged'&&d.flags.length)||(f=='nochain'&&!d.flags.some(x=>/corporate/i.test(x)))||(f=='stale'&&d.stale)||(f=='email'&&d.email)));
 L.sort({tier:(a,b)=>a.tier-b.tier||b.reviews-a.reviews,reviews:(a,b)=>b.reviews-a.reviews,audit:(a,b)=>(a.audit??101)-(b.audit??101),followers:(a,b)=>(b.followers||0)-(a.followers||0)}[s]);
 $('#count').textContent=`${L.length} shown`;
 if(!L.includes(sel))sel=window.innerWidth>820?L[0]||null:null;
 $('#list').innerHTML=L.length?L.map((d,i)=>`<li role="option" tabindex="-1" data-i="${i}" aria-selected="${d===sel}"><span class="tier" data-t="${d.tier}" style="background:var(--t${d.tier||5})">${d.tier||'?'}</span>
  <div style="min-width:0"><div class="nm">${esc(d.name)}</div><div class="sub">${esc(d.niche)} · ${esc(d.city)} · ${d.rating?d.rating+'★ ('+d.reviews+')':'no rating'}</div></div>
  <div class="sc">${d.audit==null?'<span class="sub">—</span>':`<span class="${cls(d.audit)}">${d.audit}</span><small>site</small>`}</div></li>`).join(''):'<li class="empty" style="display:block;cursor:default">No leads match these filters.</li>';
 document.querySelectorAll('#list li[data-i]').forEach(li=>li.onclick=()=>{sel=L[+li.dataset.i];document.body.classList.add('sheet-open');paint()});
 paint()}
function paint(){document.querySelectorAll('#list li[data-i]').forEach(li=>{const on=L[+li.dataset.i]===sel;li.setAttribute('aria-selected',on);if(on)li.scrollIntoView({block:'nearest'})});
 $('#sheet').innerHTML=sel?sheet(sel):'<div class="empty">Select a lead.</div>'}
const A=(u,t,c)=>u?`<a ${c?`class="${c}" `:''}href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:'';
const gaps=d=>[!d.website&&'No website',d.website&&d.audit!=null&&d.audit<55&&'Weak website ('+d.audit+'/100)',d.stale&&'Outdated website',!d.ig&&'No Instagram found',d.posts60!=null&&d.posts60<8&&'Posts rarely ('+d.posts60+' in 60 days)',!d.email&&'No email found',!d.owner&&'Owner unknown',!d.meta&&'No Meta pixel (no ads tracking)',!d.agency&&'No agency credit'].filter(Boolean).map(esc);
function sheet(d){const b=d.brief,ps=d.psi;
 return `<div class="in"><button class="back" onclick="document.body.classList.remove('sheet-open')">← All leads</button>
 <div class="top"><span class="tier" data-t="${d.tier}" style="background:var(--t${d.tier||5})">${d.tier||'?'}</span><div><h2>${esc(d.name)}</h2>
 <div class="sub">${esc(d.niche)} · ${esc(d.address||d.city)}</div></div></div>
 <div class="acts">${d.phone?`<a class="pri" href="tel:${esc(d.phone)}">Call ${esc(d.phone)}</a>`:''}${d.email?`<a href="mailto:${esc(d.email)}">Email</a>`:''}${A(d.website,'Website')}${A(d.ig,'Instagram')}${A(d.maps,'Maps')}${A(d.linkedin,'Owner LinkedIn')}</div>
 ${d.flags.map(x=>`<span class="flag">${esc(x)}</span>`).join('')}
 <section><h3>What they're missing</h3><p style="max-width:68ch;margin:0">${gaps(d).join(' · ')||'No obvious gaps found.'}</p><p class="sub">${esc(d.tierWhy)}</p></section>
 <section><h3>What we found</h3><div class="facts">
  <div><p><b>${esc(d.owner)||'Owner unknown'}</b>${d.ownerTitle?' · '+esc(d.ownerTitle):''}</p><p class="sub">${esc(d.email)||'No email found'}</p></div>
  <div><p><b>Website</b> ${d.audit==null?'<span class="sub">not graded</span>':`<span class="${cls(d.audit)}">${d.audit}/100</span>`}</p>
   ${ps?`<div class="bars">${[['performance','Speed'],['accessibility','Accessibility'],['best-practices','Best practices'],['seo','SEO']].map(([k,n])=>ps[k]==null?'':`<div class="bar"><span>${n}</span><i class="${cls(ps[k])}"><s style="width:${ps[k]}%"></s></i><span>${ps[k]}</span></div>`).join('')}</div>${d.psiUrl?`<p class="sub">${A(d.psiUrl,'Full Lighthouse report')}</p>`:''}`:''}
   <p class="sub">Last updated ${esc(d.updated)||'unknown'}${d.stale?' · outdated':''}</p>${d.issues?`<p class="sub">${esc(d.issues).replace(/; /g,'<br>')}</p>`:''}</div>
  <div><p><b>Instagram</b></p><p>${d.followers==null?(d.ig?'Not checked':'None found'):num(d.followers)+' followers · '+num(d.views)+' avg views · '+d.posts60+' posts / 60 days'}</p>
   <p class="sub">${d.meta?'Running Meta ads':'No Meta pixel'} · ${esc(d.agency)||'no agency credit'}</p></div>
  <div><p><b>Services to pitch</b></p><p>${d.pitch.map(esc).join(' · ')||'—'}</p></div></div></section>
 <section><h3>Suggested talking points</h3><h3 style="margin-top:14px">Open with</h3><p class="open">${esc(b.opening)}</p></section>
 <section><h3>Points to raise</h3><ol>${b.points.map(p=>`<li>${lnk(p)}</li>`).join('')}</ol></section>
 <section><h3>Questions to ask</h3><ul class="q">${b.questions.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section>
 <section><h3>First ask</h3><p class="ask">${esc(b.ask)}</p></section>
 <section><h3>Our proof</h3><p style="max-width:68ch;margin:0">${lnk(b.proof)}</p></section>
 <details><summary>Why Nexposure</summary><p>${esc(d.why)}</p><p class="sub">${esc(d.does)}</p></details></div>`}
['q','niche','flag','sort'].forEach(id=>$('#'+id).addEventListener('input',render));
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(document.activeElement.tagName)||!L.length)return;const k={ArrowDown:1,j:1,ArrowUp:-1,k:-1}[e.key];
 if(k){e.preventDefault();sel=L[Math.max(0,Math.min(L.length-1,L.indexOf(sel)+k))];paint()}});
render();
</script></body></html>
